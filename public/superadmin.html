<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SuperAdmin - DN Verification</title>
  <link href="css/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <h1 class="text-xl font-semibold text-gray-900">SuperAdmin - DN Verification</h1>
        </div>
        <div class="flex items-center space-x-4">
          <span id="userName" class="text-sm text-gray-700"></span>
          <button onclick="logout()" class="text-sm text-gray-600 hover:text-gray-900">Cerrar Sesión</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Tabs -->
    <div class="border-b border-gray-200 mb-6">
      <nav class="-mb-px flex space-x-8">
        <button onclick="showTab('tenants')" id="tab-tenants" class="tab-button border-b-2 border-gray-900 py-4 px-1 text-sm font-medium text-gray-900">
          Tenants
        </button>
        <button onclick="showTab('audit')" id="tab-audit" class="tab-button border-b-2 border-transparent py-4 px-1 text-sm font-medium text-gray-500 hover:text-gray-700 hover:border-gray-300">
          Auditoría
        </button>
      </nav>
    </div>

    <!-- Tenants Tab -->
    <div id="tenants-tab" class="tab-content">
      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow p-6">
          <div class="text-sm font-medium text-gray-500">Total Tenants</div>
          <div id="totalTenants" class="mt-2 text-3xl font-semibold text-gray-900">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="text-sm font-medium text-gray-500">Activos</div>
          <div id="activeTenants" class="mt-2 text-3xl font-semibold text-green-600">-</div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="text-sm font-medium text-gray-500">Suspendidos</div>
          <div id="suspendedTenants" class="mt-2 text-3xl font-semibold text-red-600">-</div>
        </div>
      </div>

      <!-- Create Tenant Button -->
      <div class="mb-6">
        <button onclick="showCreateTenantModal()" class="bg-gray-900 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-800">
          + Crear Tenant
        </button>
      </div>

      <!-- Tenants Table -->
      <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">API Status</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Último Login</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
            </tr>
          </thead>
          <tbody id="tenantsTableBody" class="bg-white divide-y divide-gray-200">
            <!-- Dynamic content -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Audit Tab -->
    <div id="audit-tab" class="tab-content hidden">
      <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Usuario</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acción</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Detalles</th>
            </tr>
          </thead>
          <tbody id="auditTableBody" class="bg-white divide-y divide-gray-200">
            <!-- Dynamic content -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Create Tenant Modal -->
  <div id="createTenantModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full hidden">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
      <div class="mt-3">
        <h3 class="text-lg font-medium text-gray-900 mb-4">Crear Nuevo Tenant</h3>
        <form id="createTenantForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
            <input type="text" id="tenantName" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="tenantEmail" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="tenantPassword" required minlength="8" class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">API Key</label>
            <input type="text" id="tenantApiKey" required class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm">
          </div>
          <div id="modalError" class="hidden bg-red-50 text-red-700 px-3 py-2 rounded text-sm"></div>
          <div id="modalSuccess" class="hidden bg-green-50 text-green-700 px-3 py-2 rounded text-sm"></div>
          <div class="flex justify-end space-x-3 pt-4">
            <button type="button" onclick="hideCreateTenantModal()" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 rounded-md hover:bg-gray-200">
              Cancelar
            </button>
            <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-gray-900 rounded-md hover:bg-gray-800">
              Crear
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/superadmin.js"></script>
</body>
</html>
