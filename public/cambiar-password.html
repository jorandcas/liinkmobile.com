<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Contraseña - DN Verification</title>
  <link href="css/output.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-gray-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-lg shadow-sm p-8">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-yellow-100 rounded-full mb-4">
          <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-semibold text-gray-900 mb-2">Cambio de Contraseña Obligatorio</h1>
        <p class="text-sm text-gray-500">Por seguridad, debe cambiar su contraseña antes de continuar</p>
      </div>

      <form id="changePasswordForm" class="space-y-5">
        <div>
          <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Contraseña Actual</label>
          <input
            type="password"
            id="currentPassword"
            name="currentPassword"
            placeholder="••••••••"
            required
            autocomplete="current-password"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900 transition-colors"
          >
        </div>

        <div>
          <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Nueva Contraseña</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Mínimo 8 caracteres"
            required
            autocomplete="new-password"
            minlength="8"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900 transition-colors"
          >
          <p class="mt-1 text-xs text-gray-500">Mínimo 8 caracteres</p>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">Confirmar Nueva Contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="••••••••"
            required
            autocomplete="new-password"
            minlength="8"
            class="w-full px-3 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-1 focus:ring-gray-900 focus:border-gray-900 transition-colors"
          >
        </div>

        <div id="message" class="hidden px-3 py-2 rounded text-sm"></div>

        <button
          type="submit"
          class="w-full bg-gray-900 text-white py-2.5 rounded-md text-sm font-medium hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-900 focus:ring-offset-2 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          <span class="btn-text">Cambiar Contraseña</span>
          <span class="btn-loader hidden">
            <svg class="animate-spin h-4 w-4 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </span>
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-gray-200">
        <button id="logoutBtn" class="w-full text-sm text-gray-600 hover:text-gray-900">
          Cerrar Sesión
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">© 2026 DN Verification - Sistema Multitenant</p>
  </div>

  <script src="js/cambiar-password.js"></script>
</body>
</html>
