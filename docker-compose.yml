# ============================================
# DOCKER-COMPOSE PARA DN VERIFICATION
# Configuración para despliegue en Coolify
# ============================================

services:
  # ============================================
  # APLICACIÓN PRINCIPAL
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dn-verification-app
    restart: unless-stopped

    # Variables de entorno
    environment:
      # Servidor
      - NODE_ENV=production
      - PORT=3000

      # Base de datos (conecta al servicio postgres)
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=bd_superadmin

      # Cifrado
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}

      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=24h

      # Validación
      - VALIDATION_TEST_PHONE=${VALIDATION_TEST_PHONE}

      # Seguridad
      - MAX_LOGIN_ATTEMPTS=5
      - ACCOUNT_LOCK_TIME=900
      - PASSWORD_MIN_LENGTH=8

    # Dependencias y health check
    depends_on:
      postgres:
        condition: service_healthy

    # Health check para la app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

    # Exponer puerto
    ports:
      - "3000:3000"

    # Volúmenes para logs y uploads (PERSISTENTES)
    volumes:
      - app-logs:/app/logs
      - app-uploads:/app/uploads
      - app-data:/app/data

    # Redes
    networks:
      - dn-verification-network

  # ============================================
  # BASE DE DATOS POSTGRESQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: dn-verification-db
    restart: unless-stopped

    # Variables de entorno PostgreSQL
    environment:
      - POSTGRES_DB=bd_superadmin
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata

    # Health check para PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bd_superadmin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # Volúmenes para persistencia de datos
    volumes:
      - postgres-data:/var/lib/postgresql/data

    # Redes
    networks:
      - dn-verification-network

# ============================================
# VOLÚMENES
# ============================================
volumes:
  postgres-data:
    name: dn-verification-postgres-data
    driver: local

  app-logs:
    name: dn-verification-logs
    driver: local

  app-uploads:
    name: dn-verification-uploads
    driver: local

  app-data:
    name: dn-verification-data
    driver: local

# ============================================
# REDES
# ============================================
networks:
  dn-verification-network:
    name: dn-verification-network
    driver: bridge
